# ==============================================================================
# Drop-in Nginx Configuration Snippet for Existing Reverse Proxies
# (CasaOS / Nginx / Cloudflare Tunnel / pihost-nginx)
# ==============================================================================
# To attach PiControl OS to your existing Nginx without modifying other sites,
# include this block inside your existing server {} definition or as a separate
# virtual host:

location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Critical SSE Stream configuration (disables proxy buffering so ticks stream live)
location /api/metrics/live {
    proxy_pass http://127.0.0.1:8090/api/metrics/live;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 86400s;
}
