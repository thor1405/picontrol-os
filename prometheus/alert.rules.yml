groups:
  - name: picontrol_rpi5_alerts
    rules:
      - alert: HostHighCpuTemperature
        expr: node_thermal_zone_temp{type="cpu-thermal"} > 80
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Raspberry Pi 5 SoC Temperature above 80°C"
          description: "Thermal sensor reported {{ $value }}°C. Active throttling may occur."

      - alert: HostHighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Utilization"
          description: "CPU usage sustained above 90% for 2 minutes."

      - alert: HostOutOfMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Memory Utilization"
          description: "Available physical memory is below 10%."

      - alert: HostLowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low Storage Space on Root Filesystem"
          description: "Storage space on root mount has less than 15% remaining."
