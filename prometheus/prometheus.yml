global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - '/etc/prometheus/alert.rules.yml'

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'picontrol-server'
    metrics_path: '/api/health'
    static_configs:
      - targets: ['picontrol-server:8090']
